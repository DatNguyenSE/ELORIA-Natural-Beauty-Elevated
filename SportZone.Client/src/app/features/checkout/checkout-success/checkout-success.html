<main class="min-h-[80vh] flex items-center justify-center bg-[var(--bg)] px-4 py-20 font-['Be_Vietnam_Pro'] relative overflow-hidden">
  
  <div class="max-w-2xl w-full text-center relative z-10">
    
    <div class="mb-8 flex justify-center">
      <div class="relative">
        <div class="h-24 w-24 bg-[#EFE4D6] rounded-full flex items-center justify-center border border-[var(--sage)]">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--sage-deep)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
        </div>
      </div>
    </div>

    <h1 class="text-4xl md:text-5xl font-['Cormorant_Garamond'] font-medium tracking-tight mb-4 text-[var(--ink)]">
      Đặt hàng thành công!
    </h1>
    
    <p class="text-[var(--ink-soft)] font-medium text-sm md:text-base mb-10 max-w-md mx-auto">
      Cảm ơn bạn đã tin tưởng ELORIA. Đơn hàng của bạn đang được chuẩn bị chu đáo và sớm được gửi đi.
    </p>

    <div class="bg-[var(--surface)] border border-[var(--line)] rounded-2xl p-8 mb-10 relative overflow-hidden shadow-sm">
      <div class="flex flex-col md:flex-row justify-between items-center gap-6 relative z-10">
        <div class="text-left w-full md:w-auto">
          <p class="text-[11px] font-semibold text-[var(--ink-soft)] uppercase tracking-wider mb-1">Mã đơn hàng</p>
          <p class="text-2xl font-bold text-[var(--ink)]">#{{ orderId() }}</p>
        </div>

        <div class="h-px w-full md:h-12 md:w-px bg-[var(--line)]"></div>

        <div class="text-left w-full md:w-auto">
          <p class="text-[11px] font-semibold text-[var(--ink-soft)] uppercase tracking-wider mb-1">Trạng thái</p>
          <p class="text-sm font-semibold uppercase text-[var(--sage-deep)] flex items-center gap-2">
            <span class="h-2.5 w-2.5 bg-[var(--sage)] rounded-full animate-pulse"></span>
            Đang xử lý
          </p>
        </div>

        <div class="h-px w-full md:h-12 md:w-px bg-[var(--line)]"></div>

        <div class="text-left w-full md:w-auto">
          <p class="text-[11px] font-semibold text-[var(--ink-soft)] uppercase tracking-wider mb-1">Thời gian dự kiến</p>
          <p class="text-sm font-semibold text-[var(--ink)]">2 - 4 ngày làm việc</p>
        </div>
      </div>
    </div>

    <div class="flex flex-col sm:flex-row gap-4 justify-center">
      <button routerLink="/order-user" 
              class="px-8 py-3.5 bg-transparent border border-[var(--line)] rounded-full font-semibold text-xs uppercase tracking-wider text-[var(--ink)] hover:border-[var(--sage)] hover:bg-[#EFE4D6] transition-all">
        Kiểm tra đơn hàng
      </button>
      <button routerLink="/" 
              class="px-8 py-3.5 bg-[var(--sage)] text-white rounded-full font-semibold text-xs uppercase tracking-wider hover:bg-[var(--sage-deep)] transition-all flex items-center justify-center gap-2">
        <span>Tiếp tục mua sắm</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14m-7-7l7 7-7 7"/>
        </svg>
      </button>
    </div>

    <div class="mt-16 pt-8 border-t border-[var(--line)] flex flex-col items-center gap-1.5">
      <p class="text-xs text-[var(--ink-soft)]">Cần hỗ trợ về đơn hàng?</p>
      <a href="tel:18006868" class="text-sm font-semibold text-[var(--sage-deep)] hover:underline">
        Hotline: 1800 6868 (Miễn phí)
      </a>
    </div>
  </div>
</main>
